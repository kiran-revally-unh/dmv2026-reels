<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DMV 2026: TikTok connected</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 48px 16px; text-align: center; background: #fff; color: #1d2633; }
  @media (prefers-color-scheme: dark) { body { background: #10151c; color: #e6edf5; } }
  .ok { font-size: 48px; } code { display: block; word-break: break-all; padding: 12px; border-radius: 10px; background: rgba(8,115,249,.1); margin: 16px 0; font-size: 14px; }
  button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 0; background: #0873f9; color: #fff; cursor: pointer; }
  .muted { opacity: .7; font-size: .9rem; }
</style>
</head>
<body>
<div class="ok" id="icon">✅</div>
<h1 id="title">TikTok connected to DMV 2026 Publisher</h1>
<p id="msg">Copy this one-time code and paste it into the DMV 2026 publisher window on your computer.</p>
<code id="code">…</code>
<button id="copy" type="button">Copy code</button>
<p class="muted">The code expires in a few minutes and only works once. You can close this page afterwards.</p>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get('code'), err = p.get('error') || p.get('error_description');
  const el = document.getElementById('code');
  if (code) { el.textContent = code; }
  else {
    document.getElementById('icon').textContent = '⚠️';
    document.getElementById('title').textContent = 'TikTok did not connect';
    document.getElementById('msg').textContent = err ? ('TikTok said: ' + err) : 'No code was received. Please start the connection again.';
    el.style.display = 'none'; document.getElementById('copy').style.display = 'none';
  }
  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(code); document.getElementById('copy').textContent = 'Copied ✓'; } catch (e) {}
  });
</script>
</body>
</html>
